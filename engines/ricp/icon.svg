<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- LithoCloud engine card icon: ricp. 64-unit grid, 2-unit margin.
       A grey point cluster, offset upper-left, is moved by a short arc-arrow
       onto the red reference cluster lower-right. Palette per BRAND.md. -->
  <g fill="#5A6470">
    <circle cx="10" cy="14" r="3.4"/>
    <circle cx="20" cy="9" r="3.4"/>
    <circle cx="18" cy="21" r="3.4"/>
    <circle cx="8" cy="27" r="3.4"/>
    <circle cx="28" cy="16" r="3.4"/>
    <circle cx="26" cy="28" r="3.4"/>
  </g>
  <g fill="#DE002B">
    <circle cx="36" cy="40" r="3.4"/>
    <circle cx="46" cy="35" r="3.4"/>
    <circle cx="44" cy="47" r="3.4"/>
    <circle cx="34" cy="53" r="3.4"/>
    <circle cx="54" cy="42" r="3.4"/>
    <circle cx="52" cy="54" r="3.4"/>
  </g>
  <!-- arc from the grey cluster's edge, sweeping over to the red one -->
  <path d="M 30 22 Q 50 14 52 28" fill="none" stroke="#1B2430"
        stroke-width="3.4" stroke-linecap="round"/>
  <path d="M 47 26 L 57 26 L 52 34 Z" fill="#1B2430"/>
</svg>
